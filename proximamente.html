<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rionimex Studios próximamente." />
    <title>Próximamente | RIONIMEX STUDIOS</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Creepster&family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/seasonal-effects.css" />
    <style>
      :root {
        --red: #d51019;
        --black: #050505;
        --panel: #0d0d0f;
        --line: #1a1a1d;
        --white: #f5f5f5;
        --muted: #a0a0a6;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--black);
        color: var(--white);
        font-family: Rajdhani, Arial, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 18%, rgba(213, 16, 25, 0.18), transparent 25%),
          linear-gradient(135deg, #050505 0%, #0b0d10 100%);
      }

      .page {
        position: relative;
        width: min(1500px, 96vw);
        min-height: min(72vh, 760px);
        height: min(82vh, 780px);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(12, 12, 14, 0.82);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }

      .page::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: radial-gradient(circle at center, black 45%, transparent 100%);
      }

      .content {
        position: relative;
        z-index: 1;
        width: min(900px, 90%);
        padding: 38px 18px;
      }

      .eyebrow {
        display: block;
        margin: 0 0 18px;
        color: var(--red);
        font: 700 clamp(0.72rem, 1vw, 1rem) Orbitron, Arial, sans-serif;
        letter-spacing: 0.32em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 auto;
        max-width: 900px;
        font: 900 clamp(3.5rem, 7vw, 9.5rem) / 0.9 Orbitron, Arial, sans-serif;
        letter-spacing: -0.07em;
        text-transform: uppercase;
        word-spacing: 0.12em;
        white-space: normal;
      }

      h1 .dot {
        color: var(--red);
      }

      p {
        margin: 22px auto 0;
        max-width: 760px;
        color: var(--muted);
        font-size: clamp(1rem, 1.8vw, 1.5rem);
        line-height: 1.5;
      }

      .actions {
        margin-top: 32px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 22px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 10px;
        background: linear-gradient(145deg, #151518, #0b0b0d);
        color: var(--white);
        font: 700 11px Orbitron, Arial, sans-serif;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2), inset 0 1px rgba(255,255,255,.04);
        transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
      }

      .btn:hover {
        border-color: var(--red);
        background: linear-gradient(135deg, #f21b29, #c90d18);
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(213, 16, 25, 0.3), inset 0 1px rgba(255,255,255,.18);
      }

      .coming-footer {
        position: fixed;
        z-index: 105;
        inset: auto 0 0;
        padding: 18px 12px;
        color: rgba(255, 255, 255, 0.72);
        font: 600 12px Rajdhani, Arial, sans-serif;
        letter-spacing: 0.08em;
        text-align: center;
      }

      .btn:focus-visible {
        outline: 2px solid var(--red);
        outline-offset: 3px;
      }

      @media (max-width: 768px) {
        body {
          overflow: hidden;
        }

        .page {
          width: min(96vw, 760px);
          min-height: 58vh;
          height: min(70vh, 560px);
          padding: 0;
        }

        .content {
          width: min(88%, 420px);
          padding: 22px 12px;
        }

        .eyebrow {
          margin-bottom: 12px;
          letter-spacing: 0.18em;
          font-size: 0.68rem;
        }

        h1 {
          letter-spacing: -0.05em;
          word-spacing: 0.06em;
          font-size: clamp(2.6rem, 12vw, 4.4rem);
        }

        p {
          margin-top: 18px;
          font-size: 1rem;
        }

        .actions {
          margin-top: 22px;
        }

        .btn {
          display: inline-flex;
          width: 100%;
          max-width: 260px;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <div class="content">
        <div class="eyebrow">RIONIMEX</div>
        <h1>LO SENTIMOS<span class="dot">.</span></h1>
        <p>Esta sección no está disponible por el momento. La actualizaremos muy pronto.</p>
        <div class="actions">
          <a class="btn" href="index.html">VOLVER AL INICIO</a>
        </div>
      </div>
    </main>
    <footer class="coming-footer">
      <div class="footer-copy" tabindex="0" role="button" aria-label="Copyright de Rionimex">Copyright © 2025-2026. RIONIMEX. TODOS LOS DERECHOS RESERVADOS.</div>
    </footer>
    <script src="js/main.js"></script>
  </body>
</html>
